name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust 1.95
        run: rustup toolchain install 1.95.0 --profile minimal && rustup default 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cli
            demo/contracts
      - name: CLI unit and integration tests
        run: cargo test --locked --manifest-path cli/Cargo.toml
      - name: Demo contract tests (every build shares one suite)
        run: cargo test --locked --manifest-path demo/contracts/Cargo.toml
      - name: Reproduce the demo report byte for byte
        run: ./reproduce.sh
      - name: Exit codes for --fail-on-divergence
        run: |
          R=cli/target/release/rehearse
          args=(--manifest demo/manifest.json --capture demo/capture)
          "$R" replay "${args[@]}" --candidate ok=demo/wasm/token-v2-compatible.wasm --out /tmp/ok.json --fail-on-divergence
          set +e
          "$R" replay "${args[@]}" --candidate bad=demo/wasm/token-v2-broken.wasm --out /tmp/bad.json --fail-on-divergence
          code=$?
          set -e
          test "$code" -eq 2 || { echo "expected exit 2 for a diverging candidate, got $code"; exit 1; }

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The published action, as the README shows it
        id: check
        uses: fexx301/rehearse@v0.1.0
        with:
          manifest: demo/manifest.json
          capture: demo/capture
          candidates: |
            v2-compatible=demo/wasm/token-v2-compatible.wasm
            v2-broken=demo/wasm/token-v2-broken.wasm
          fail-on-divergence: 'false'
      - name: It used the release and caught the broken upgrade
        run: |
          test "${{ steps.check.outputs.installed-from }}" = release
          test "${{ steps.check.outputs.exit-code }}" = 2
          test "${{ steps.check.outputs.diverged }}" = true
