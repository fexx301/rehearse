# Builds the rehearse CLI for macOS and Linux. Pushing a v* tag also publishes the
# archives as a GitHub release, then runs the action (action.yml) against them.
# A manual run (workflow_dispatch) only builds, as a dry run.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-14 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --manifest-path cli/Cargo.toml --target ${{ matrix.target }}
      - name: Check it runs
        if: matrix.target != 'x86_64-apple-darwin'
        run: cli/target/${{ matrix.target }}/release/rehearse --version
      - name: Package
        shell: bash
        run: |
          name=rehearse-${{ matrix.target }}
          mkdir -p dist/$name
          cp cli/target/${{ matrix.target }}/release/rehearse LICENSE README.md dist/$name/
          tar -C dist -czf dist/$name.tar.gz $name
          (cd dist && shasum -a 256 $name.tar.gz > $name.tar.gz.sha256 && cat $name.tar.gz.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the CLI version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' cli/Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but cli/Cargo.toml says $version"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "rehearse $GITHUB_REF_NAME" --notes "Prebuilt \`rehearse\` CLI for macOS (Apple silicon, Intel) and Linux (x86-64, arm64). Each archive has a \`.sha256\` next to it. The binaries are not code-signed: download with \`curl\` (see the README) to avoid macOS's quarantine prompt.

          Use it in GitHub Actions with \`uses: fexx301/rehearse@$GITHUB_REF_NAME\`. Usage, the demo and limits are in the [README](https://github.com/fexx301/rehearse#readme)."

  test-action:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: A compatible upgrade passes
        id: ok
        uses: ./
        with:
          manifest: demo/manifest.json
          capture: demo/capture
          candidates: v2-compatible=demo/wasm/token-v2-compatible.wasm
          version: ${{ github.ref_name }}
          artifact-name: rehearse-${{ matrix.os }}-compatible
      - name: A broken upgrade is caught
        id: broken
        uses: ./
        with:
          manifest: demo/manifest.json
          capture: demo/capture
          candidates: |
            v2-compatible=demo/wasm/token-v2-compatible.wasm
            v2-broken=demo/wasm/token-v2-broken.wasm
          fail-on-divergence: 'false'
          version: ${{ github.ref_name }}
          artifact-name: rehearse-${{ matrix.os }}-broken
      - name: Check the outcomes
        run: |
          test "${{ steps.ok.outputs.installed-from }}" = release
          test "${{ steps.ok.outputs.exit-code }}" = 0
          test "${{ steps.broken.outputs.exit-code }}" = 2
          test "${{ steps.broken.outputs.diverged }}" = true
          test -f "${{ steps.broken.outputs.report-html }}"
