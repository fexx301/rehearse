[package]
name = "rehearse"
version = "0.1.0"
edition = "2021"
description = "Replay a Soroban contract's real workflows against candidate Wasm on captured ledger state, before upgrading."
license = "Apache-2.0"
publish = false

[workspace]
members = ["."]
# Resolver 1 keeps the experimental `next` feature consistent across the
# soroban-env-host build and runtime dependency graph (see spike notes).
resolver = "1"

[dependencies]
soroban-sdk = { version = "=28.0.0", features = ["testutils"] }
soroban-env-host = { version = "=28.0.2", features = ["next"] }
soroban-ledger-snapshot = "=28.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }

[profile.dev]
debug = 0
